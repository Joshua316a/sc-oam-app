# ─── QA Profile ────────────────────────────────────────────────────────────
# Profile: qa
# Purpose: Quality Assurance - black-box testing of released versions
# Features: Built artifacts only, no source mounts, PostgreSQL
# Container prefix: sc-oam-qa- (different from dev, enables simultaneous runs)
# Ports: set via SERVICE_BASE_PORT and SERVICE_FRONTEND_PORT env vars
#   from run.sh (default: 8002/3002 for qa)

# ════════════════════════════════════════════════════════════════════════
# 🌐 Base Port Configuration (inherited from shell environment)
# ════════════════════════════════════════════════════════════════════════
# This profile uses:
#   SERVICE_BASE_PORT + 2 offset from run.sh defaults (default: 8002 for qa)
#   SERVICE_FRONTEND_PORT + 2 offset from run.sh defaults (default: 3002 for qa)

# ═════════════════════════════════════════════════════════════════════════
# 🐍 Backend Service (Core Agent - QA Mode)
# ═════════════════════════════════════════════════════════════════════════

services:
  backend:
    # Environment from .env file
    env_file: .env
    restart: unless-stopped
    build: .
    
    # Production entrypoint - self-contained, no source code mounts
    entrypoint: /app/prod_entrypoint.sh
    
    # Static uvicorn without --reload (stable QA environment)
    # Uses SERVICE_BASE_PORT set by run.sh
    command: ["--host", "0.0.0.0", "--port", "${SERVICE_BASE_PORT}"]
    
    # NO source code mounts - uses built artifacts only
    # Only data volumes for database persistence
    volumes:
      - production_db:/var/lib/app/data
    
    # Port mapping: hosts ${SERVICE_BASE_PORT}:8000
    ports:
      - "${SERVICE_BASE_PORT}:8000"
    
    # Environment block - ALL entries as KEY=VALUE strings
    environment:
      - OAM_AGENT=core
      - OAM_ROLE=primary
      - DEPLOY_ENV=qa
      - DATABASE_URL=postgresql://oam_user:oam_pass@db:5432/sc_oam_qa
      - VITE_API_BASE=http://localhost:${SERVICE_BASE_PORT}/api
    
    networks:
      - oam-net
    
    # QA-focused health check (uses container internal port 8000)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ═════════════════════════════════════════════════════════════════════════
  # 🌐 Frontend Service (QA Web UI)
  # ═════════════════════════════════════════════════════════════════════════

  frontend:
    env_file: .env
    image: nginx:alpine
    
    # Built React dist only - no source code
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx/qa.conf:/etc/nginx/conf.d/default.conf:ro
    
    # Port mapping: hosts ${SERVICE_FRONTEND_PORT}:80
    ports:
      - "${SERVICE_FRONTEND_PORT}:80"
    
    # Environment block - ALL entries as KEY=VALUE strings
    environment:
      - OAM_AGENT=web
      - OAM_ROLE=frontend
      - DEPLOY_ENV=qa
      - VITE_API_BASE=http://localhost:${SERVICE_BASE_PORT}/api
      - VITE_PORT=${SERVICE_FRONTEND_PORT}
    
    networks:
      - oam-net

  # ════════════════════════════════════════════════════════════════════════
  # 📊 QA Profile Database (PostgreSQL)
  # ═════════════════════════════════════════════════════════════════════════

  db:
    image: postgres:15-alpine
    
    # QA-specific PostgreSQL configuration
    env_file: .env
    
    environment:
      POSTGRES_DB: sc_oam_qa
      POSTGRES_USER: oam_user
      POSTGRES_PASSWORD: ${QA_DB_PASSWORD}  # From .env file
    
    volumes:
      - production_db:/var/lib/postgresql/data
    
    networks:
      - oam-net

# ═════════════════════════════════════════════════════════════════════════
# 📋 QA-Specific Notes
# ══════════════════════════════════════════════════════════════════════════

# Port configuration for qa profile:
#   - Backend API:  ${SERVICE_BASE_PORT}  (set by run.sh, default: 8002 for qa)
#   - Frontend:   ${SERVICE_FRONTEND_PORT}  (set by run.sh, default: 3002 for qa)
#   - run.sh defaults:  SERVICE_BASE_PORT=8002, SERVICE_FRONTEND_PORT=3002
#   - Override with:  ./run.sh qa core --base-port 9000 --frontend-port 3003
#   - Change SERVICE_BASE_PORT and SERVICE_FRONTEND_PORT in run.sh to shift ports

# QA Workflow:
# 1. Build frontend: cd web && npm run build
# 2. Run QA: ./run.sh qa core (uses defaults: 8002/3002)
# 2. Access: API at http://localhost:8002, UI at http://localhost:3002
# 3. Test previous release while developer works in dev environment